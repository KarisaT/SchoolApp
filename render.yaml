services:
  - type: web
    name: schoolapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: schoolapp-db
          property: connectionString

databases:
  - name: schoolapp-db
    plan: free